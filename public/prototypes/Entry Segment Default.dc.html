<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,500;0,600;0,700;0,800&display=swap" rel="stylesheet">
<style>
  body { margin:0; font-family:'Nunito',system-ui,sans-serif; background:#fff; }
  a { color:#2f6fc4; } a:hover { color:#255aa0; }
  *::-webkit-scrollbar { width:10px; }
  *::-webkit-scrollbar-thumb { background:#cdd7e4; border-radius:6px; border:2px solid transparent; background-clip:content-box; }
</style>
</helmet>
<div style="position:relative;width:1440px;height:900px;overflow:hidden;background:#fff;font-family:'Nunito',system-ui,sans-serif;">

  <!-- Canvas (dimmed behind drawer) -->
  <div style="position:absolute;inset:0;background:#5f7bab;">
    <div style="position:absolute;top:0;left:0;right:0;height:56px;background:#fff;"></div>
    <div style="position:absolute;top:56px;left:0;right:0;height:36px;background:#eef1f6;"></div>
    <button style="position:absolute;top:34px;left:6px;width:34px;height:34px;border-radius:50%;border:1px solid #d8e0ea;background:#fff;color:#2f6fc4;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.12);">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>

    <!-- exit rules pill -->
    <div style="position:absolute;top:78px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #dbe3ee;border-radius:10px;padding:9px 16px;font-size:14px;color:#3a4a63;font-weight:600;box-shadow:0 1px 4px rgba(30,50,90,.08);opacity:.55;">
      <span style="display:flex;align-items:center;gap:7px;">⚑ 0 exit rules</span>
      <span style="color:#c3ccd9;">·</span><span>Re-enrollment: off</span>
      <span style="color:#c3ccd9;">·</span><a style="color:#2f6fc4;text-decoration:none;">Manage</a>
    </div>

    <!-- flow skeleton, faded -->
    <div style="position:absolute;top:150px;left:0;right:360px;bottom:0;display:flex;flex-direction:column;align-items:center;opacity:.32;">
      <div style="width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.28);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px;">START</div>
      <div style="width:230px;height:150px;border:2px dashed rgba(255,255,255,.5);border-radius:12px;margin-top:-22px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:26px;color:#fff;font-weight:700;font-size:18px;">Segment Name</div>
      <div style="width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.28);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;margin:14px 0;">+</div>
      <div style="width:150px;height:300px;border-radius:26px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);"></div>
      <div style="width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.28);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;margin:14px 0;">+</div>
      <div style="width:230px;height:90px;border-radius:12px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;letter-spacing:1px;">EXIT</div>
    </div>
  </div>

  <!-- Scrim -->
  <div style="position:absolute;inset:0;background:rgba(20,34,60,.18);"></div>

  <!-- ENTRY SEGMENT DRAWER -->
  <div style="position:absolute;top:0;right:0;width:720px;height:900px;background:#eef1f6;box-shadow:-8px 0 32px rgba(20,34,60,.22);display:flex;flex-direction:column;">

    <!-- header -->
    <div style="padding:32px 40px 20px;">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;">
        <h1 style="margin:0;font-size:34px;font-weight:800;color:#17335f;letter-spacing:-.4px;">Entry Segment</h1>
        <button style="background:none;border:none;cursor:pointer;color:#17335f;padding:4px;display:flex;">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <p style="margin:8px 0 0;font-size:17px;color:#8a95a6;font-weight:500;">All users in the following segments will receive this automation</p>
    </div>

    <!-- SEGMENTS section header -->
    <div style="padding:6px 40px 14px;display:flex;align-items:center;justify-content:space-between;">
      <h2 style="margin:0;font-size:22px;font-weight:800;color:#17335f;">Segments</h2>
      <div onClick="{{ toggleSegments }}" style="{{ segToggleStyle }}">
        <div style="{{ segKnobStyle }}"></div>
      </div>
    </div>

    <!-- segments body -->
    <sc-if value="{{ segmentsOn }}" hint-placeholder-val="{{ true }}">
    <div style="flex:1;min-height:0;display:flex;flex-direction:column;padding:0 40px;">
      <!-- search + groups -->
      <div style="display:flex;gap:12px;margin-bottom:6px;">
        <div style="flex:1;display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #d8e0ea;border-radius:12px;padding:0 18px;height:56px;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#17335f" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input placeholder="Search for a segment" style="flex:1;border:none;outline:none;background:none;font-family:inherit;font-size:17px;color:#17335f;font-weight:600;" />
        </div>
        <button style="display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #d8e0ea;border-radius:12px;padding:0 20px;height:56px;font-family:inherit;font-size:17px;font-weight:700;color:#17335f;cursor:pointer;">
          Groups
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </button>
      </div>

      <!-- column head -->
      <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 4px 12px 0;border-bottom:1px solid #dde4ee;">
        <div style="display:flex;align-items:center;gap:18px;">
          <div style="width:26px;height:26px;border:2px solid #b7c2d2;border-radius:7px;background:#fff;"></div>
          <span style="font-size:17px;font-weight:800;color:#17335f;">Segment name</span>
        </div>
        <span style="font-size:17px;font-weight:800;color:#17335f;">Approximate users</span>
      </div>

      <!-- list -->
      <div style="flex:1;min-height:0;overflow-y:auto;">
        <sc-for list="{{ segments }}" as="seg" hint-placeholder-count="9">
          <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 4px 14px 0;">
            <div style="display:flex;align-items:center;gap:18px;">
              <div style="width:26px;height:26px;border:2px solid #b7c2d2;border-radius:7px;background:#fff;flex:none;"></div>
              <span style="font-size:19px;font-weight:600;color:#1b3a63;">{{ seg.name }}</span>
              <svg width="15" height="15" viewBox="0 0 24 24" fill="#4a6088"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 4-6 8-6s8 2 8 6"></path></svg>
            </div>
            <span style="font-size:18px;font-weight:600;color:#4a6088;">{{ seg.users }}</span>
          </div>
        </sc-for>
      </div>

      <div style="padding:12px 0;border-top:1px solid #dde4ee;font-size:16px;font-weight:600;color:#8a95a6;">{{ selectedLabel }}</div>
    </div>
    </sc-if>

    <!-- GEOFENCES collapsed row -->
    <div style="border-top:1px solid #dde4ee;padding:20px 40px;display:flex;align-items:center;justify-content:space-between;">
      <h2 style="margin:0;font-size:22px;font-weight:800;color:#17335f;">Geofences</h2>
      <div onClick="{{ toggleGeofences }}" style="{{ geoToggleStyle }}">
        <div style="{{ geoKnobStyle }}"></div>
      </div>
    </div>

    <!-- footer -->
    <div style="border-top:1px solid #dde4ee;padding:20px 40px;display:flex;align-items:center;justify-content:flex-end;gap:22px;background:#eef1f6;">
      <button style="background:none;border:none;font-family:inherit;font-size:19px;font-weight:700;color:#5a6b85;cursor:pointer;">Cancel</button>
      <button style="background:#2f5aa0;border:none;border-radius:12px;padding:14px 34px;font-family:inherit;font-size:19px;font-weight:700;color:#fff;cursor:pointer;box-shadow:0 2px 8px rgba(47,90,160,.35);">Save</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { segmentsOn: true, geofencesOn: true };
  toggle(k){ return () => this.setState(s => ({ [k]: !s[k] })); }
  renderVals(){
    const seg = this.state.segmentsOn, geo = this.state.geofencesOn;
    const track = on => ({ width:'62px', height:'32px', borderRadius:'999px', cursor:'pointer', flex:'none',
      background: on ? 'linear-gradient(180deg,#4a93d8,#2f7fd6)' : '#c3ccd9',
      display:'flex', alignItems:'center', padding:'3px', transition:'background .15s' });
    const knob = on => ({ width:'26px', height:'26px', borderRadius:'50%', background:'#fff',
      boxShadow:'0 1px 3px rgba(0,0,0,.25)', transform: on ? 'translateX(30px)' : 'translateX(0)', transition:'transform .15s' });
    return {
      segmentsOn: seg,
      toggleSegments: this.toggle('segmentsOn'),
      toggleGeofences: this.toggle('geofencesOn'),
      segToggleStyle: track(seg), segKnobStyle: knob(seg),
      geoToggleStyle: track(geo), geoKnobStyle: knob(geo),
      selectedLabel: '0 selected of 478',
      segments: [
        {name:'muzzk10', users:'1'}, {name:'Sampa Test', users:'1'}, {name:'Shalana Test', users:'1'},
        {name:'muzzsidekiq', users:'1'}, {name:'muzz', users:'1'}, {name:'Q2 Smart: All Users', users:'5'},
        {name:'load test users 200k batch2', users:'199998'}, {name:'200k users', users:'200000'},
        {name:'test_segment_upload', users:'5'}, {name:'test_data_seg', users:'0'}, {name:'muzzk8', users:'0'},
        {name:'minnn seg', users:'0'}, {name:'mux', users:'0'}, {name:'muz test', users:'0'},
        {name:'mukkk copy01', users:'0'}, {name:'muzz seg', users:'1'}, {name:'mukkk', users:'0'},
        {name:'test-a', users:'0'}, {name:'Test CSV Upload', users:'0'}, {name:'all user', users:'0'}
      ]
    };
  }
}
</script>
</body>
</html>
